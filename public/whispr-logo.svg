<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- App icon background -->
  <rect width="1024" height="1024" rx="220" fill="#0a0a0a"/>

  <!-- Subtle purple border -->
  <rect width="1024" height="1024" rx="220" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.4"/>

  <!-- Waveform bars LEFT -->
  <rect x="148" y="420" width="36" height="120" rx="18" fill="#a855f7" opacity="0.3"/>
  <rect x="200" y="370" width="36" height="220" rx="18" fill="#a855f7" opacity="0.5"/>
  <rect x="252" y="310" width="36" height="340" rx="18" fill="#a855f7" opacity="0.7"/>

  <!-- Waveform bars RIGHT -->
  <rect x="840" y="420" width="36" height="120" rx="18" fill="#a855f7" opacity="0.3"/>
  <rect x="788" y="370" width="36" height="220" rx="18" fill="#a855f7" opacity="0.5"/>
  <rect x="736" y="310" width="36" height="340" rx="18" fill="#a855f7" opacity="0.7"/>

  <!-- Microphone body -->
  <rect x="412" y="240" width="200" height="320" rx="100" fill="#a855f7"/>

  <!-- Microphone shine -->
  <ellipse cx="470" cy="310" rx="28" ry="40" fill="white" opacity="0.12"/>

  <!-- Stand arc -->
  <path d="M340 520 Q340 660 512 660 Q684 660 684 520" fill="none" stroke="#a855f7" stroke-width="28" stroke-linecap="round"/>

  <!-- Vertical stem -->
  <line x1="512" y1="660" x2="512" y2="750" stroke="#a855f7" stroke-width="28" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="380" y1="750" x2="644" y2="750" stroke="#a855f7" stroke-width="28" stroke-linecap="round"/>

  <!-- Ghost dots on mic -->
  <circle cx="512" cy="340" r="18" fill="white" opacity="0.1"/>
  <circle cx="512" cy="400" r="12" fill="white" opacity="0.07"/>

</svg>
